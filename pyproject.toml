[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "android-agent"
version = "0.1.0"
description = "Autonomous AI Agent operating on Android Emulator and Physical Devices via ADB and Gemini AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.1",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
android-agent = "android_agent.cli:main"
